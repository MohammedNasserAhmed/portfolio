<!doctype html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blog - M. N. Jaber</title>
        <meta name="description" content="Thoughts on AI, Engineering, and Tech." />
        <link rel="stylesheet" href="dist/style.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
    </head>
    <body class="bg-brand-dark text-brand-light-gray font-sans">
        <!-- Header -->
        <header class="bg-brand-dark/70 backdrop-blur-lg sticky top-0 z-50 border-b border-glass-border">
            <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
                <a href="/" class="text-2xl font-bold text-white">
                    M. N. <span class="text-brand-red">Jaber</span>
                </a>
                <a href="/" class="text-gray-300 hover:text-white transition-colors">Back to Portfolio</a>
            </nav>
        </header>

        <main class="container mx-auto px-6 py-12">
            <h1 class="text-4xl font-bold text-white mb-12 text-center">Latest <span class="text-brand-red">Thoughts</span></h1>
            
            <div id="blog-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-6xl mx-auto">
                <!-- Posts will be injected here -->
                <div class="glass-panel p-6 rounded-xl animate-pulse">
                    <div class="h-6 bg-gray-700 rounded w-3/4 mb-4"></div>
                    <div class="h-4 bg-gray-800 rounded w-full mb-2"></div>
                    <div class="h-4 bg-gray-800 rounded w-2/3"></div>
                </div>
            </div>
        </main>

        <script type="module">
            import { BlogComponent } from './src/components/blog-component.js';
            const blog = new BlogComponent();
            blog.init();
        </script>
    </body>
</html>
